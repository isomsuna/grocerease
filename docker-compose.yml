services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocerease}
      POSTGRES_USER: ${POSTGRES_USER:-grocerease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocerease}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - grocerease_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocerease} -d ${POSTGRES_DB:-grocerease}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocerease_postgres_data:
