name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build and type check
        id: build
        run: npm run build

      - name: Report results
        if: always()
        run: |
          echo "## Frontend CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Type check and production build: ${{ steps.build.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: not configured (no frontend test script exists yet)" >> "$GITHUB_STEP_SUMMARY"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      POSTGRES_DB: grocerease_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grocerease_test
        options: >-
          --health-cmd="pg_isready -U postgres -d grocerease_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations
        id: migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        id: tests
        run: python manage.py test

      - name: Report results
        if: always()
        run: |
          echo "## Backend CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations check: ${{ steps.migrations.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
